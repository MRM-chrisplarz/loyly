    const expoCard=(e,idx)=>{const isCold=e.type==='cold',running=!!e.startedAt;return `<article class="exposure-card" data-type="${e.type}" data-exposure-id="${esc(e.id)}"><div class="exposure-top"><div class="exposure-symbol ${isCold?'cold':''}">${icon(isCold?'snow':'flame')}</div><div><strong>${isCold?'Cold plunge':'Sauna'} ${idx+1}</strong><br><span>Cycle ${e.cycle||1}</span></div><div class="exposure-right"><button class="icon-btn" data-action="remove-exposure" data-id="${esc(e.id)}" aria-label="Remove exposure" title="Remove exposure">${icon('trash')}</button></div></div><div class="timer-wrap"><div><div class="timer-number" data-timer="${esc(e.id)}">${fmtTimer(getElapsed(e))}</div><div class="timer-caption">${running?'Timer running':'Minutes : seconds'}</div></div><div class="timer-actions"><button class="button tiny ${isCold?'ice':''}" data-action="timer-toggle" data-id="${esc(e.id)}">${icon(running?'pause':'play',15)} ${running?'Pause':'Start'}</button><button class="icon-btn" data-action="timer-reset" data-id="${esc(e.id)}" aria-label="Reset timer" title="Reset timer">${icon('reset')}</button></div></div><div class="exposure-details"><div class="field-grid"><div class="field"><label for="duration-${esc(e.id)}">Duration (min)</label><input id="duration-${esc(e.id)}" inputmode="decimal" type="number" step="0.1" min="0" max="1440" data-exposure="${esc(e.id)}" data-field="duration" value="${oneDecimal(getElapsed(e)/60)}" ${running?'disabled':''}></div><div class="field"><label for="temp-${esc(e.id)}">Temp (°F)</label><input id="temp-${esc(e.id)}" inputmode="decimal" type="number" min="20" max="240" step="0.1" data-exposure="${esc(e.id)}" data-field="temp" placeholder="—" value="${esc(e.temp)}"></div><div class="field"><label for="cycle-${esc(e.id)}">Cycle #</label><input id="cycle-${esc(e.id)}" inputmode="numeric" type="number" min="1" max="99" step="1" data-exposure="${esc(e.id)}" data-field="cycle" value="${e.cycle||1}"></div></div><span class="mini-label">What did you do?</span><div class="activity-group">${ACTIVITIES[e.type].map(a=>`<button class="activity-chip ${e.activities.includes(a)?'chosen':''}" data-action="activity" data-id="${esc(e.id)}" data-activity="${esc(a)}" aria-pressed="${e.activities.includes(a)}">${esc(a)}</button>`).join('')}</div></div></article>`};
    const editor=()=>{const v=data.draft;if(!v){view='home';return home()}const editing=data.visits.some(x=>x.id===v.id);let total={sauna:0,cold:0};v.exposures.forEach(e=>total[e.type]+=getElapsed(e));return `<div class="page"><div class="editor-bar"><button class="button ghost tiny" data-action="editor-close">${icon('left')} Back</button><span>${editing?'Editing a saved visit':'New journal entry'} · Auto-saved draft</span></div><div class="header-content"><div><div class="eyebrow">${editing?'EDIT YOUR RITUAL':'BEGIN YOUR RITUAL'}</div><h1>${editing?'Revisit your session.':'Your time to reset.'}</h1><p>Record as you go, or fill in the details afterward. Everything can be edited.</p></div></div><div class="editor-grid"><div><section class="card pad"><div class="pane-heading"><h3>Visit details</h3><p>The beginning of your spa visit.</p></div><div class="field-grid"><div class="field"><label for="visit-date">Date</label><input type="date" id="visit-date" data-draft="date" value="${esc(v.date)}" required></div><div class="field"><label for="visit-time">Arrival time</label><input type="time" id="visit-time" data-draft="time" value="${esc(v.time||'')}"></div></div></section><section class="card pad section-spacing"><div class="card-head"><div><div class="card-title">Heat & cold</div><div class="card-sub">Log as many exposures and cycles as you like.</div></div></div>${v.exposures.length?v.exposures.map(expoCard).join(''):noData('Ready for your first cycle','Add a sauna or cold plunge to start tracking.')}<div class="add-actions"><button class="button" data-action="add-exposure" data-type="sauna">${icon('flame')} Add sauna</button><button class="button ice" data-action="add-exposure" data-type="cold">${icon('snow')} Add cold plunge</button></div><div class="editor-summary"><span class="summary-dot"></span><span>${v.exposures.length} exposures</span><span>Sauna ${humanMin(total.sauna)}m</span><span>Cold ${humanMin(total.cold)}m</span></div></section></div><div><section class="card pad"><div class="pane-heading"><h3>How do you feel?</h3><p>A few seconds of reflection can show meaningful personal patterns.</p></div><span class="mini-label">Before your visit</span>${moodScale('moodBefore',v.moodBefore)}<span class="mini-label">After your visit</span>${moodScale('moodAfter',v.moodAfter)}<div class="field section-spacing"><label for="visit-notes">Session notes (optional)</label><textarea id="visit-notes" data-draft="notes" placeholder="Anything worth remembering?">${esc(v.notes||'')}</textarea></div></section><div class="save-bar"><button class="button ghost" data-action="discard">${editing?'Discard changes':'Discard draft'}</button><button class="button" data-action="save">${icon('check')} ${editing?'Save changes':'Save visit'}</button></div><p class="fine-print" style="margin-top:12px">Keep one timer running at a time. A running timer measures elapsed clock time and will continue if you leave this page until you pause or save.</p></div></div></div>`};
    const sideNav=()=>{const items=[['home','Dashboard','home'],['journal','Journal','history'],['insights','Insights','insights'],['profile','Profile','profile']];return `<aside class="side"><div class="brand"><svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M6 32c6-10 12-10 18 0s12 10 18 0" stroke="#a8c8b8" stroke-width="3" stroke-linecap="round"/><path d="M10 18c4-6 8-6 12 0s8 6 12 0" stroke="#a8c8b8" stroke-width="3" stroke-linecap="round"/><path d="M16 8c2-3 4-3 6 0s4 3 6 0" stroke="#a8c8b8" stroke-width="2" stroke-linecap="round"/></svg><div><div class="brand-title">LÖYLY</div><div class="brand-sub">Nordic journal</div></div></div><nav class="side-nav" aria-label="Main navigation">${items.map(([key,label,i])=>`<button class="${(view==='editor'?'journal':view)===key?'active':''}" data-action="nav" data-view="${key}">${icon(i)} ${label}</button>`).join('')}</nav><div class="side-quote">“Make space for a little stillness.”<span>Heat · Cold · Presence</span></div></aside><nav class="mobile-nav" aria-label="Mobile navigation">${items.map(([key,label,i])=>`<button class="${(view==='editor'?'journal':view)===key?'active':''}" data-action="nav" data-view="${key}">${icon(i)}<span>${label}</span></button>`).join('')}</nav>`};
    const render=()=>{document.getElementById('app').innerHTML=`<div class="shell">${sideNav()}<main class="main"><div class="topbar"><div class="topbar-date">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div><div class="topbar-right"><span class="eyebrow" style="letter-spacing:.1em">NORDIC WELLNESS</span><button class="avatar" aria-label="Open profile" data-action="nav" data-view="profile">${esc((data.profile.name.trim()[0]||'L').toUpperCase())}</button></div></div>${view==='home'?home():view==='journal'?journal():view==='insights'?insights():view==='profile'?profile():editor()}<footer class="footer">LÖYLY · Your quiet ritual, recorded with care</footer></main></div>`;if(storageError)flash('Local storage is blocked. Please export your visit data.');};
    const findExp=id=>(data.draft?.exposures||[]).find(e=>e.id===id);
    const stopAllTimers=(exceptId=null)=>{if(!data.draft)return;data.draft.exposures.forEach(e=>{if(e.startedAt&&e.id!==exceptId){e.durationSec=getElapsed(e);e.startedAt=null}})};
    const nextCycle=type=>{const es=data.draft.exposures;if(!es.length)return 1;const last=es[es.length-1],cycle=last.cycle||1,same=es.filter(e=>e.cycle===cycle);return last.type!==type&&!same.some(e=>e.type===type)?cycle:cycle+1};
    const openEditor=id=>{if(data.draft){if(data.draft.id===id){view='editor';render();return}if(!confirm('Starting another visit will discard your unfinished draft. Continue?'))return;stopAllTimers();data.draft=null}
      if(id){const v=data.visits.find(v=>v.id===id);if(!v)return;data.draft=JSON.parse(JSON.stringify(v));data.draft.exposures.forEach(e=>e.startedAt=null)}else data.draft=newDraft();persist();view='editor';render();window.scrollTo(0,0)};
    const closeEditor=()=>{stopAllTimers();persist();view='journal';render();window.scrollTo(0,0)};
    const saveVisit=()=>{const v=data.draft;if(!v)return;if(!/^\d{4}-\d\d-\d\d$/.test(v.date)||localDate(safeDate(v.date))!==v.date){flash('Choose a valid visit date.');return}if(!v.exposures.length){flash('Add at least one sauna or cold plunge.');return}stopAllTimers();const clean=JSON.parse(JSON.stringify(v));clean.exposures.forEach(e=>{e.startedAt=null;e.durationSec=Math.max(0,Math.round(e.durationSec||0));e.cycle=Math.max(1,Math.min(99,Math.trunc(e.cycle||1)))});const i=data.visits.findIndex(x=>x.id===clean.id);if(i>=0)data.visits[i]=clean;else data.visits.push(clean);data.draft=null;persist();view='journal';render();window.scrollTo(0,0);flash(i>=0?'Visit updated':'Visit saved to your journal')};
    const downloadable=(name,content,type)=>{const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};
    const csvValue=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
    const exportCsv=()=>{const head=['Visit ID','Date','Arrival time','Mood before (1-5)','Mood after (1-5)','Visit notes','Exposure ID','Cycle','Type','Minutes','Temperature °F','Activities'];const rows=[head];data.visits.forEach(v=>{if(!v.exposures.length)rows.push([v.id,v.date,v.time,v.moodBefore||'',v.moodAfter||'',v.notes,'','','','','','']);else v.exposures.forEach(e=>rows.push([v.id,v.date,v.time,v.moodBefore||'',v.moodAfter||'',v.notes,e.id,e.cycle,e.type,oneDecimal(e.durationSec/60),e.temp,e.activities.join('; ')]))});downloadable(`loyly-journal-${localDate()}.csv`, '\ufeff'+rows.map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8');flash('CSV export created')};
    const exportJson=()=>{const backup={...data,draft:null,exportedAt:new Date().toISOString()};downloadable(`loyly-backup-${localDate()}.json`,JSON.stringify(backup,null,2),'application/json');flash('Full journal backup created')};
    const cleanImport=x=>{if(!x||x.version!==1||!Array.isArray(x.visits)||typeof x.profile!=='object')throw Error('Not a LÖYLY v1 backup');if(x.visits.length>20000)throw Error('Backup is too large');const safeVisits=x.visits.map(v=>{if(!v||typeof v!=='object'||typeof v.date!=='string'||!Array.isArray(v.exposures))throw Error('Invalid visit');return {id:String(v.id||uid()),date:localDate(safeDate(v.date)),time:String(v.time||''),moodBefore:[1,2,3,4,5].includes(+v.moodBefore)?+v.moodBefore:0,moodAfter:[1,2,3,4,5].includes(+v.moodAfter)?+v.moodAfter:0,notes:String(v.notes||''),createdAt:Number(v.createdAt)||Date.now(),exposures:v.exposures.map(e=>({id:String(e.id||uid()),type:e.type==='cold'?'cold':'sauna',cycle:Math.max(1,Math.min(99,Math.trunc(+e.cycle||1))),temp:Number.isFinite(+e.temp)&&e.temp!==''?String(e.temp):'',durationSec:Math.max(0,Math.round(+e.durationSec||0)),startedAt:null,activities:Array.isArray(e.activities)?e.activities.filter(a=>typeof a==='string').slice(0,20):[]}))}});return {...fresh(),profile:{name:String(x.profile.name||''),gender:String(x.profile.gender||'prefer-not'),weight:String(x.profile.weight||''),goal:Math.max(1,Math.min(6,+x.profile.goal||3))},visits:safeVisits}};
    document.addEventListener('click',event=>{const btn=event.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
      if(a==='nav'){if(view==='editor'&&data.draft){stopAllTimers();persist()}view=btn.dataset.view;render();window.scrollTo(0,0)}
      else if(a==='new')openEditor(null);
      else if(a==='resume'){if(data.draft){view='editor';render();window.scrollTo(0,0)}}
      else if(a==='edit')openEditor(btn.dataset.id);
      else if(a==='delete'){const v=data.visits.find(v=>v.id===btn.dataset.id);if(v&&confirm(`Delete the spa visit on ${formatDate(v.date)}? This cannot be undone.`)){data.visits=data.visits.filter(x=>x.id!==v.id);persist();render();flash('Visit deleted')}}
      else if(a==='period'){period=btn.dataset.period;anchor=localDate();render()}
      else if(a==='period-prev'||a==='period-next'){shiftAnchor(a==='period-prev'?-1:1);render()}
      else if(a==='editor-close'){closeEditor()}
      else if(a==='add-exposure'){if(!data.draft)return;const type=btn.dataset.type;data.draft.exposures.push(exposure(type,nextCycle(type)));persist();render()}
      else if(a==='remove-exposure'){const e=findExp(btn.dataset.id);if(e&&confirm('Remove this exposure from your visit?')){data.draft.exposures=data.draft.exposures.filter(x=>x.id!==e.id);persist();render()}}
      else if(a==='timer-toggle'){const e=findExp(btn.dataset.id);if(!e)return;if(e.startedAt){e.durationSec=getElapsed(e);e.startedAt=null}else{stopAllTimers(e.id);e.startedAt=Date.now()}persist();render()}
      else if(a==='timer-reset'){const e=findExp(btn.dataset.id);if(e&&confirm('Reset this exposure timer to zero?')){e.durationSec=0;e.startedAt=null;persist();render()}}
      else if(a==='activity'){const e=findExp(btn.dataset.id);if(!e)return;const tag=btn.dataset.activity;e.activities=e.activities.includes(tag)?e.activities.filter(t=>t!==tag):[...e.activities,tag];persist();render()}
      else if(a==='mood'){if(!data.draft)return;const f=btn.dataset.field,n=+btn.dataset.rating;data.draft[f]=data.draft[f]===n?0:n;persist();render()}
      else if(a==='save')saveVisit();
      else if(a==='discard'){if(!data.draft)return;if(data.draft.exposures.length&&!confirm('Discard this draft and its unsaved changes?'))return;data.draft=null;persist();view='journal';render();flash('Draft discarded')}
      else if(a==='export-csv')exportCsv();else if(a==='export-json')exportJson();
      else if(a==='import-json')document.getElementById('import-file')?.click();
      else if(a==='clear-data'){if(confirm('Permanently erase ALL saved visits, profile details, and drafts from this browser? Export a backup first if you want to keep them.')){data=fresh();persist();view='profile';render();flash('Journal data erased')}}
    });
    document.addEventListener('input',event=>{const el=event.target;if(el.dataset.draft&&data.draft){data.draft[el.dataset.draft]=el.value;persist()}
      if(el.dataset.profile){const f=el.dataset.profile;data.profile[f]=f==='goal'?Math.max(1,Math.min(6,+el.value||3)):el.value;persist()}
      if(el.dataset.exposure){const e=findExp(el.dataset.exposure);if(!e)return;const f=el.dataset.field;if(f==='duration'){if(e.startedAt)return;e.durationSec=Math.max(0,Math.min(1440,Number(el.value)||0))*60}else if(f==='cycle'){e.cycle=Math.max(1,Math.min(99,Math.floor(Number(el.value)||1)))}else if(f==='temp'){e.temp=el.value}persist()}
    });
    document.addEventListener('change',async event=>{if(event.target?.id==='import-file'){const file=event.target.files?.[0];if(!file)return;try{if(file.size>15e6)throw Error('File exceeds 15 MB');const x=cleanImport(JSON.parse(await file.text()));if(!confirm(`Replace your current journal with this backup (${x.visits.length} visits)? This overwrites all current entries.`))return;data=x;persist();view='journal';render();flash('Backup imported successfully')}catch(error){flash('Import failed: '+error.message)}finally{event.target.value=''}}});
    setInterval(()=>{if(view!=='editor'||!data.draft)return;data.draft.exposures.forEach(e=>{if(e.startedAt){const el=document.querySelector(`[data-timer="${CSS.escape(e.id)}"]`);if(el)el.textContent=fmtTimer(getElapsed(e))}})},250);
    if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    render();

  })();
  </script>
</body>
